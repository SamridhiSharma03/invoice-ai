<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aravali AP · Invoice desk</title>
<style>
:root{--bg:#eef1f4;--card:#fff;--ink:#0f2438;--mute:#5d6f82;--line:#dbe2e9;--acc:#0e6f73;--acc2:#e3f2f2;--ok:#1b7f52;--okb:#e2f4ea;--rv:#a86a00;--rvb:#fdf1d8;--rj:#b83a1c;--rjb:#fbe5de}
@media(prefers-color-scheme:dark){:root{--bg:#0c151f;--card:#14212e;--ink:#e6edf3;--mute:#8fa3b6;--line:#243545;--acc:#4cc2c4;--acc2:#12303a;--ok:#5fd09a;--okb:#123425;--rv:#f0b64a;--rvb:#3a2d10;--rj:#ff8f70;--rjb:#3b1b13}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;display:flex;min-height:100vh}
nav{width:220px;background:var(--card);border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{font-weight:700;font-size:17px;padding:0 10px 18px;line-height:1.2}.brand small{display:block;font-weight:400;color:var(--mute);font-size:12px;margin-top:3px}
nav a{padding:9px 12px;border-radius:8px;color:var(--mute);text-decoration:none;font-weight:600;cursor:pointer}nav a:hover{background:var(--bg)}nav a.on{background:var(--acc2);color:var(--acc)}
nav .foot{margin-top:auto;font-size:12px;color:var(--mute);padding:0 10px}
main{flex:1;padding:30px 36px;max-width:1100px}h1{font-size:24px;margin:0 0 4px}.sub{color:var(--mute);margin:0 0 22px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
button{font:inherit;font-weight:600;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;cursor:pointer}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}button:hover{filter:brightness(.96)}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px}.APPROVE{background:var(--okb);color:var(--ok)}.REVIEW{background:var(--rvb);color:var(--rv)}.REJECT{background:var(--rjb);color:var(--rj)}
.drop{border:2px dashed var(--line);border-radius:10px;padding:26px;text-align:center;color:var(--mute);margin-bottom:18px;background:var(--card)}.drop.over{border-color:var(--acc);background:var(--acc2)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}.mute{color:var(--mute)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px}@media(max-width:900px){body{flex-direction:column}nav{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap}main{padding:20px}.split{grid-template-columns:1fr}}
.st{display:flex;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.st:last-child{border:0}.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);margin-top:4px;flex:none}
.dot.running{border-color:var(--acc);border-top-color:transparent;animation:sp 1s linear infinite}.dot.done{background:var(--ok);border-color:var(--ok)}.dot.warning{background:var(--rv);border-color:var(--rv)}.dot.failed{background:var(--rj);border-color:var(--rj)}
@keyframes sp{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.dot.running{animation:none}}
.st b{display:block}.st span{color:var(--mute);font-size:13px}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mute);font-size:13px;font-weight:600}td,th{padding:9px 8px;border-bottom:1px solid var(--line)}tr.cl{cursor:pointer}tr.cl:hover{background:var(--bg)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:18px}.kpi b{font-size:26px;display:block}.kpi span{color:var(--mute);font-size:13px}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line);margin:12px 0}
label{display:block;font-weight:600;margin:12px 0 4px}input,select,textarea{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.chip{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600;margin:2px 4px 2px 0}
pre{white-space:pre-wrap;background:var(--bg);padding:12px;border-radius:8px;font:13px/1.45 inherit;margin:8px 0}#toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;display:none}
</style></head><body>
<nav aria-label="Main"><div class="brand">Aravali Industries<small>Accounts payable · invoice desk</small></div>
<a data-v="process">Process</a><a data-v="dash">Dashboard</a><a data-v="pos">PO ledger</a><a data-v="policy">Policy</a>
<div class="foot">Built by Samridhi Sharma, IIT Delhi<br><span id="gem"></span></div></nav>
<main id="m"></main><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s),api=(p,o)=>fetch('/api'+p,o).then(async r=>{const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||'Request failed');return j}),
inr=n=>n==null?'-':new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(n),
toast=t=>{const e=$('#toast');e.textContent=t;e.style.display='block';setTimeout(()=>e.style.display='none',3200)},
tag=d=>`<span class="tag ${d}">${{APPROVE:'Approved',REVIEW:'Needs review',REJECT:'Rejected'}[d]||d}</span>`,
esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const STAGES=['Intake','Extract','Completeness','Vendor check','PO match','Rules engine','Decision','Explain'];
let es;
function nav(){const h=location.hash.slice(2).split('/'),v=h[0]||'process';document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.v===v||(v==='run'&&a.dataset.v==='process')));
 if(es)es.close();({process:viewProcess,dash:viewDash,pos:viewPos,policy:viewPolicy,run:()=>viewRun(h[1])}[v]||viewProcess)()}
document.querySelectorAll('nav a').forEach(a=>a.onclick=()=>location.hash='#/'+a.dataset.v);addEventListener('hashchange',nav);
api('/health').then(h=>$('#gem').textContent=h.gemini?'Gemini key: connected':'No Gemini key: samples only');

async function startSample(id){try{const r=await api('/runs/sample/'+id,{method:'POST'});location.hash='#/run/'+r.id}catch(e){toast(e.message)}}
async function upload(f){const fd=new FormData();fd.append('file',f);try{const r=await api('/runs',{method:'POST',body:fd});location.hash='#/run/'+r.id}catch(e){toast(e.message)}}
async function runAll(){const s=await api('/samples');for(const [i,x] of s.entries()){toast(`Running ${i+1} of ${s.length}: ${x.label}`);const r=await api('/runs/sample/'+x.id,{method:'POST'});while((await api('/runs/'+r.id)).status!=='DONE')await new Promise(r=>setTimeout(r,300))}toast('All samples processed');location.hash='#/dash'}

async function viewProcess(){const s=await api('/samples');$('#m').innerHTML=`<h1>Process an invoice</h1><p class="sub">Upload a PDF, or run one of the prepared scenarios. Order matters: later invoices see earlier approvals.</p>
<div class="drop" id="dz">Drop an invoice PDF here or <label style="display:inline;margin:0"><u style="cursor:pointer;color:var(--acc)">choose a file</u><input id="fi" type="file" accept="application/pdf" hidden></label><br><small>Uploads are read by Gemini; use synthetic invoices only.</small></div>
<div class="row sp" style="margin-bottom:12px"><h2 style="margin:0;font-size:17px">Prepared scenarios</h2><span class="row"><button class="p" id="all">Run all in order</button><button id="rs">Reset demo data</button></span></div>
<div class="grid">${s.map(x=>`<div class="card"><div class="row sp"><b>${x.id.toUpperCase()}</b>${tag(x.expected)}</div><p style="margin:8px 0 4px">${x.label}</p><p class="mute" style="margin:0 0 12px;font-size:13px">${esc(x.vendor)} · ${inr(x.total)}</p><button class="p" onclick="startSample('${x.id}')">Run</button></div>`).join('')}</div>`;
 const dz=$('#dz');dz.ondragover=e=>{e.preventDefault();dz.classList.add('over')};dz.ondragleave=()=>dz.classList.remove('over');dz.ondrop=e=>{e.preventDefault();upload(e.dataTransfer.files[0])};$('#fi').onchange=e=>upload(e.target.files[0]);
 $('#all').onclick=runAll;$('#rs').onclick=async()=>{if(confirm('Delete all runs?')){await api('/reset',{method:'POST'});toast('Demo data reset')}}}

function viewRun(id){$('#m').innerHTML=`<div class="row sp"><div><h1>Live run <span class="mute" style="font-weight:400">${id}</span></h1><p class="sub" id="rn">Starting...</p></div><button onclick="location.hash='#/process'">Back to scenarios</button></div><div class="split"><div class="card" id="tl"></div><div id="res"></div></div>`;
 const S={};const draw=()=>$('#tl').innerHTML=STAGES.map(n=>{const s=S[n]||{status:'pending',msg:''};return`<div class="st"><div class="dot ${s.status}"></div><div><b>${n}</b><span>${esc(s.msg)||'Waiting'}</span></div></div>`}).join('');
 const add=e=>{S[e.stage]={status:e.status,msg:e.msg};if(e.stage==='Extract'&&e.status==='failed')S.Extract.msg='Failed: '+e.msg;draw()};draw();
 const fin=async()=>{const r=await api('/runs/'+id);$('#rn').textContent=r.name;result(r)};
 es=new EventSource('/api/runs/'+id+'/stream');es.onmessage=m=>add(JSON.parse(m.data));es.addEventListener('end',()=>{es.close();fin()});es.onerror=()=>{es.close();fin()};
 api('/runs/'+id).then(r=>$('#rn').textContent=r.name)}

function result(r){const rev=r.decision==='REVIEW'&&r.final==='REVIEW',ex=r.ex||{};
 $('#res').innerHTML=`<div class="card"><div class="row sp"><h2 style="margin:0">Decision</h2>${tag(r.final)}</div>
 ${r.final!==r.decision?`<p class="mute" style="margin:6px 0 0">Automated decision was ${tag(r.decision)}; changed by a reviewer.</p>`:''}
 <p>${esc(r.explanation)}</p><div>${(r.reasons||[]).map(x=>`<span class="chip" title="${esc(x.detail)}">${x.code}</span>`).join('')||'<span class="chip">All checks passed</span>'}</div>
 ${r.message?`<h3 style="margin:16px 0 4px;font-size:14px">Drafted message to vendor</h3><pre>${esc(r.message)}</pre><button onclick="navigator.clipboard.writeText(${esc(JSON.stringify(r.message)).replace(/"/g,'&quot;')});toast('Copied')">Copy message</button>`:''}
 ${rev?`<h3 style="margin:16px 0 4px;font-size:14px">Reviewer action</h3><input id="nt" placeholder="Note (required)"><div class="row" style="margin-top:8px"><button class="p" onclick="rv('${r.id}','APPROVE')">Approve</button><button onclick="rv('${r.id}','REJECT')">Reject</button></div>`:''}
 <div class="row" style="margin-top:14px"><button onclick="re('${r.id}')">Re-evaluate under current policy</button><span class="mute" style="font-size:13px">Policy v${r.policy_version}</span></div></div>
 <div class="card" style="margin-top:14px"><b>Extracted fields</b><table>${Object.entries(ex).map(([k,v])=>`<tr><td class="mute">${k.replace(/_/g,' ')}</td><td>${v==null?'<i class="mute">not found</i>':esc(v)}</td></tr>`).join('')}</table></div>`}
async function rv(id,a){try{await api(`/runs/${id}/review`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:a,note:$('#nt').value})});toast('Recorded');result(await api('/runs/'+id))}catch(e){toast(e.message)}}
async function re(id){const x=await api(`/runs/${id}/reevaluate`,{method:'POST'});toast(`Policy v${x.version}: ${x.before} → ${x.after}`)}

async function viewDash(){const r=await api('/runs'),n=r.length,c=k=>r.filter(x=>x.final===k).length,sum=r.filter(x=>x.final==='APPROVE').reduce((a,x)=>a+(x.ex.total||0),0);
 $('#m').innerHTML=`<h1>Dashboard</h1><p class="sub">History and outcomes across every run.</p>${n?`<div class="kpis"><div class="card kpi"><b>${n}</b><span>Runs</span></div><div class="card kpi"><b>${Math.round(c('APPROVE')/n*100)}%</b><span>Approved</span></div><div class="card kpi"><b>${c('REVIEW')}</b><span>Awaiting review</span></div><div class="card kpi"><b>${c('REJECT')}</b><span>Rejected</span></div><div class="card kpi"><b>${inr(sum)}</b><span>Approved value</span></div></div>
 <div class="card"><div class="bar">${[['APPROVE','--ok'],['REVIEW','--rv'],['REJECT','--rj']].map(([k,v])=>`<div style="width:${c(k)/n*100}%;background:var(${v})"></div>`).join('')}</div>
 <table><tr><th>Invoice</th><th>Vendor</th><th>Amount</th><th>Decision</th><th>Policy</th></tr>${r.map(x=>`<tr class="cl" onclick="location.hash='#/run/${x.id}'"><td>${esc(x.ex.invoice_number||x.name)}</td><td>${esc(x.ex.vendor_name||'-')}</td><td>${inr(x.ex.total)}</td><td>${x.status==='DONE'?tag(x.final):'Running'}</td><td>v${x.policy_version||'-'}</td></tr>`).join('')}</table></div>`
 :`<div class="card"><p>No runs yet. Process an invoice to see results here.</p><button class="p" onclick="location.hash='#/process'">Go to scenarios</button></div>`}`}

async function viewPos(){const p=await api('/pos');$('#m').innerHTML=`<h1>PO ledger</h1><p class="sub">Remaining balance falls only when an invoice is approved.</p><div class="card"><table><tr><th>PO</th><th>Vendor</th><th>Total</th><th>Remaining</th><th></th></tr>${p.map(x=>`<tr><td>${x.po}</td><td>${esc(x.vendor)}</td><td>${inr(x.total)}</td><td>${inr(x.remaining)}</td><td style="width:140px"><div class="bar" style="margin:0"><div style="width:${(x.total-x.remaining)/x.total*100}%;background:var(--acc)"></div></div></td></tr>`).join('')}</table></div>`}

async function viewPolicy(){const {version:v,policy:p}=await api('/policy'),F=[['ok_pct','Auto-approve tolerance (%)'],['ok_abs','Auto-approve tolerance, minimum (₹)'],['review_pct','Review limit (%), above this is rejected'],['high_value','High-value threshold (₹), always needs sign-off'],['stale_days','Invoice considered stale after (days)']],A=['REVIEW','REJECT'];
 $('#m').innerHTML=`<h1>Policy <span class="mute" style="font-weight:400">v${v}</span></h1><p class="sub">Changes create a new version. Past runs keep the version they ran under; use Re-evaluate on a run to apply the new one.</p><div class="card" style="max-width:560px">
 ${F.map(([k,l])=>`<label>${l}</label><input id="p_${k}" type="number" step="any" value="${p[k]}">`).join('')}
 ${[['unknown_vendor','Unknown vendor'],['no_po','No PO found']].map(([k,l])=>`<label>${l}</label><select id="p_${k}">${A.map(a=>`<option ${p[k]===a?'selected':''}>${a}</option>`).join('')}</select>`).join('')}
 <label>Change note</label><input id="p_note" placeholder="Why are you changing this?"><div class="row" style="margin-top:16px"><button class="p" id="sv">Save new version</button></div></div>`;
 $('#sv').onclick=async()=>{const q={};[...F.map(f=>f[0]),'unknown_vendor','no_po'].forEach(k=>q[k]=$('#p_'+k).value);try{await api('/policy',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({policy:q,note:$('#p_note').value})});toast('Saved as a new version');viewPolicy()}catch(e){toast(e.message)}}}
nav();
</script></body></html>
